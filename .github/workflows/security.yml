name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'ari/core/composer.lock'
      - 'ari/web-client/package-lock.json'
  pull_request:
    paths:
      - 'ari/core/composer.lock'
      - 'ari/web-client/package-lock.json'
  schedule:
    # Run weekly on Monday at 08:00 UTC to catch newly published CVEs
    - cron: '0 8 * * 1'

jobs:
  php-audit:
    name: PHP Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Install PHP dependencies (no dev)
        working-directory: ari/core
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Run composer audit
        working-directory: ari/core
        # Fails on HIGH and CRITICAL advisories; INFO/LOW are reported but non-blocking.
        run: composer audit --no-dev --format=plain

  npm-audit:
    name: NPM Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ari/web-client/package-lock.json

      - name: Install NPM dependencies
        working-directory: ari/web-client
        run: npm ci --ignore-scripts

      - name: Run npm audit
        working-directory: ari/web-client
        # Fails only on HIGH and CRITICAL vulnerabilities
        run: npm audit --audit-level=high
