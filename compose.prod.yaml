name: ari-prod

services:
  app:
    container_name: ari-prod-app
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_USER: "${MARIADB_USER}"
      DB_PASSWORD: "${MARIADB_PASSWORD}"
      DB_NAME: "${MARIADB_DB}"
      DB_VERSION: "11.4.9-MariaDB"
      CORS_ALLOW_ORIGIN: '^https?://.*$'
      JWT_PASSPHRASE: ${JWT_PASSPHRASE}
      JWT_SECRET_KEY: /app/core/config/jwt/private.pem
      JWT_PUBLIC_KEY: /app/core/config/jwt/public.pem
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      DEFAULT_URI: "http://localhost:8080"
      APP_VERSION: "${APP_VERSION:-dev}"
      LOG_TENANT_HASH_KEY: "${LOG_TENANT_HASH_KEY:-}"
      METRICS_SECRET: "${METRICS_SECRET:-}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./core/public/uploads:/app/core/public/uploads
      - app_data:/app/core/var
      - app_config_jwt:/app/core/config/jwt

  database:
    profiles: [ mysql ]
    container_name: ari-prod-database
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DB}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "mariadb-admin ping -h localhost -u$${MARIADB_USER:-app} -p$${MARIADB_PASSWORD:-!ChangeMe!} || exit 1" ]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql

volumes:
  database_data:
  app_data:
  app_config_jwt:
