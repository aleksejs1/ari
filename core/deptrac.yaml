deptrac:
  paths:
    - src
  layers:
    # ── Domain ──────────────────────────────────────────────
    - name: Entity
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Entity\\.*#'
    - name: Dto
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Dto\\.*#'
    - name: Message
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Message\\.*#'
    - name: Event
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Event\\.*#'
    - name: Security
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Security\\.*#'

    # ── Application ─────────────────────────────────────────
    - name: Service
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Service\\.*#'
    - name: MessageHandler
      collectors:
        - type: classNameRegex
          value: '#^Ari\\MessageHandler\\.*#'
    - name: EventListener
      collectors:
        - type: classNameRegex
          value: '#^Ari\\EventListener\\.*#'
    - name: EventSubscriber
      collectors:
        - type: classNameRegex
          value: '#^Ari\\EventSubscriber\\.*#'

    # ── Presentation / API ──────────────────────────────────
    - name: Controller
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Controller\\.*#'
    - name: Command
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Command\\.*#'
    - name: State
      collectors:
        - type: classNameRegex
          value: '#^Ari\\State\\.*#'
    - name: ApiResource
      collectors:
        - type: classNameRegex
          value: '#^Ari\\ApiResource\\.*#'
    - name: Form
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Form\\.*#'
    - name: Filter
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Filter\\.*#'
    - name: OpenApi
      collectors:
        - type: classNameRegex
          value: '#^Ari\\OpenApi\\.*#'

    # ── Infrastructure ──────────────────────────────────────
    - name: Repository
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Repository\\.*#'
    - name: Doctrine
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Doctrine\\.*#'
    - name: Kernel
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Kernel$#'

    # ── Domain helpers ──────────────────────────────────────
    - name: Exception
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Exception\\.*#'
    - name: ValueObject
      collectors:
        - type: classNameRegex
          value: '#^Ari\\ValueObject\\.*#'

    # ── Plugin bundles ───────────────────────────────────────
    # Plugin classes live under the Plugins\ namespace (ari/core/plugins/).
    # See ari-pm/docs/PluginSecurityContract.md for the isolation contract.
    - name: Plugin
      collectors:
        - type: classNameRegex
          value: '#^Plugins\\.*#'

    # ── External ────────────────────────────────────────────
    - name: Vendor
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^(Symfony|Doctrine|ApiPlatform|Gesdinet|Intervention|League|Psr|Composer|Sabre|Monolog|Lexik)\\.*#'

  ruleset:
    # ── Domain ──────────────────────────────────────────────
    Entity:
      - Dto            # API Platform input/output class references (metadata)
      - Filter         # API Platform #[ApiFilter()] attributes (metadata)
      - Repository     # Doctrine #[Entity(repositoryClass:)] attribute (metadata)
      - Security       # TenantAwareInterface implementation
      - State          # API Platform provider/processor class references in #[ApiResource] (metadata)
      - Controller     # API Platform controller class references in #[ApiResource] (metadata)
      - Vendor
      - Doctrine
    Dto:
      - Entity         # ContactImportDto references Group entity
      - State          # API Platform provider metadata in #[ApiResource] (EventTypeDto)
      - Vendor         # Symfony Validator constraints
    Message: []        # Pure value objects — zero dependencies
    Event:
      - Entity
    Security:
      - Entity
      - Repository # Authenticators may query repositories (e.g. ApiKeyAuthenticator)
      - Service   # Voters may call services (e.g. EntitlementService for quota checks)
      - Vendor

    # ── Application ─────────────────────────────────────────
    Service:
      - Dto
      - Entity
      - Event
      - Exception
      - Kernel         # getProjectDir(), ARI_VERSION constant
      - Message        # Dispatching Messenger messages
      - Repository
      - Security
      - ValueObject
      - Vendor
      - Doctrine
    MessageHandler:
      - Dto
      - Entity
      - Message
      - Repository
      - Service
      - Vendor
    EventListener:
      - Entity
      - Repository
      - Vendor
    EventSubscriber:
      - Entity
      - Event
      - Exception
      - Security
      - Service
      - Vendor

    # ── Presentation / API ──────────────────────────────────
    Controller:
      - Entity
      - Exception
      - Form
      - Security
      - Service
      - Vendor
      - ApiResource
    Command:
      - Entity
      - Exception
      - Service
      - Vendor
      - ApiResource
    State:
      - ApiResource
      - Dto
      - Entity
      - Event
      - Kernel         # getProjectDir(), ARI_VERSION constant
      - Repository     # State providers may access repositories directly (e.g. ApiKeyProvider)
      - Security
      - Service
      - Vendor
    ApiResource:
      - Entity
      - Service
      - Vendor
      - State
      - Controller
    Form:
      - Entity
      - Vendor
    Filter:
      - Entity
      - Security
      - Vendor
    OpenApi:
      - Vendor

    # ── Infrastructure ──────────────────────────────────────
    Repository:
      - Entity
      - Vendor
    Doctrine:
      - Entity
      - Security
      - Vendor
    Kernel:
      - Vendor

    # ── Plugin bundles ───────────────────────────────────────
    # Plugins may use ORM (TenantFilter is active automatically) but NOT raw DBAL Connection
    # (would bypass TenantFilter silently). See ari-pm/docs/PluginSecurityContract.md.
    #
    # Note: Deptrac cannot restrict specific classes within the Vendor layer. The DBAL
    # Connection restriction is enforced via PluginSecurityContract.md documentation and
    # code review checklist. A future PHPStan custom rule could automate this check.
    Plugin:
      - Entity
      - Repository
      - Service
      - Vendor
