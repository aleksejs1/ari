deptrac:
  paths:
    - src
  layers:
    - name: Service
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Service\\.*#'
    - name: Command
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Command\\.*#'
    - name: ApiResource
      collectors:
        - type: classNameRegex
          value: '#^Ari\\ApiResource\\.*#'
    - name: Controller
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Controller\\.*#'
    - name: Entity
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Entity\\.*#'
    - name: Repository
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Repository\\.*#'
    - name: Form
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Form\\.*#'
    - name: Security
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Security\\.*#'
    - name: State
      collectors:
        - type: classNameRegex
          value: '#^Ari\\State\\.*#'
    - name: Doctrine
      collectors:
        - type: classNameRegex
          value: '#^Ari\\Doctrine\\.*#'
    - name: OpenApi
      collectors:
        - type: classNameRegex
          value: '#^Ari\\OpenApi\\.*#'
    - name: Vendor
      collectors:
        - type: bool
          must:
            - type: classNameRegex
              value: '#^(Symfony|Doctrine|ApiPlatform)\\.*#'
  ruleset:
    Service:
      - Entity
      - Repository
      - Security
      - Vendor
      - Doctrine
    Command:
      - Entity
      - Service
      - Vendor
      - ApiResource
    ApiResource:
      - Entity
      - Service
      - Vendor
      - State
      - Controller
    State:
      - Entity
      - Security
      - Vendor
      - Service
      - ApiResource
    Controller:
      - Entity
      - Form
      - Security
      - Service
      - Vendor
      - ApiResource
    Entity:
      - Repository
      - Security
      - Vendor
      - Doctrine
    Repository:
      - Entity
      - Vendor
    Form:
      - Entity
      - Vendor
    Security:
      - Entity
      - Vendor

    Doctrine:
      - Entity
      - Security
      - Vendor
    OpenApi:
      - Vendor
