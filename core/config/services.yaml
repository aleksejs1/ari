# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

imports:
    - { resource: parameters.yaml }
    - { resource: env_parameters.yaml }

parameters:

services:

    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $importLimit: '%app.google.contacts_import_limit%'
            $telegramBotSecret: '%telegram_bot_secret%'
            $telegramBotName: '%telegram_bot_name%'

    Ari\Service\ContactImport\XmlImportService:
        arguments:
            $importLimit: '%app.xml.import_limit%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    Ari\:
        resource: '../src/'
        exclude:
            - '../src/Controller/Api/E2eController.php'
            - '../src/Service/E2e/'
            - '../src/Command/E2eSeedCommand.php'

    # AI: SymfonyAiBundleClient with optional PlatformInterface.
    # $platform is null when no platform is configured in ai.yaml → isAvailable() returns false.
    # To enable AI: install a bridge (e.g., composer require symfony/ai-open-ai-platform),
    # configure ai.yaml with the provider, and set AI_API_KEY + AI_MODEL in .env.local.
    Ari\Service\Ai\Provider\SymfonyAiBundleClient:
        arguments:
            $platform: '@?Symfony\AI\Platform\PlatformInterface'
            $apiKey: '%ai_api_key%'
            $model: '%ai_model%'
            $maxTokens: '%ai_max_tokens%'
            $provider: '%ai_provider%'

    Ari\Service\Ai\LlmClientInterface: '@Ari\Service\Ai\Provider\SymfonyAiBundleClient'

    _instanceof:
        Ari\Service\ContactImport\ContactDuplicateCheckerInterface:
            tags: ['app.contact_duplicate_checker']

    Ari\EventSubscriber\AuditLogSubscriber:
        tags:
            - { name: doctrine.event_listener, event: onFlush }
            - { name: doctrine.event_listener, event: postPersist }
            - { name: doctrine.event_listener, event: postUpdate }
            - { name: doctrine.event_listener, event: postRemove }
    Ari\Doctrine\DBAL\SqliteForeignKeyMiddleware:
        tags:
            - { name: 'doctrine.middleware', connection: 'default', priority: 1000 }

    Ari\Service\Marketplace\PluginValidatorService:
        arguments:
            $maxArchiveSize: '%plugin_max_archive_size%'

    # Ensure UserOwnerProcessor is available for plugins (loaded dynamically)
    Ari\State\UserOwnerProcessor:
        public: true
