framework:
    rate_limiter:
        ai_requests:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        api_key_requests:
            policy: sliding_window
            limit: 1000
            interval: '1 hour'
        # Telegram Bot API enforces ~30 messages/second per bot globally.
        # This token-bucket limiter caps outbound sends at 25/second to stay safely
        # below that threshold and avoid 429 errors that block the bot for all users.
        telegram_outbound:
            policy: token_bucket
            limit: 25
            rate:
                interval: '1 second'
                amount: 25

        # Playbook activation: prevent brute-force playbook spam per user.
        playbook_activation:
            policy: token_bucket
            limit: 20
            rate:
                interval: '1 hour'
                amount: 20
        # Task completion: protect task completion endpoint from abuse.
        task_completion:
            policy: token_bucket
            limit: 200
            rate:
                interval: '1 hour'
                amount: 200
        # SMS import: file upload is CPU/IO intensive; cap at 5 uploads per day per user.
        sms_import:
            policy: token_bucket
            limit: 5
            rate:
                interval: '1 day'
                amount: 5

when@test:
    framework:
        rate_limiter:
            ai_requests:
                policy: no_limit
            api_key_requests:
                policy: no_limit
            telegram_outbound:
                policy: no_limit
            playbook_activation:
                policy: no_limit
            task_completion:
                policy: no_limit
            sms_import:
                policy: no_limit
