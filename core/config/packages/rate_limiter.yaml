framework:
    rate_limiter:
        ai_requests:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
        api_key_requests:
            policy: sliding_window
            limit: 1000
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            ai_requests:
                policy: no_limit
            api_key_requests:
                policy: no_limit
