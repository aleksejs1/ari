framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%messenger_transport_dsn%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            # Dedicated transport for AI tasks — isolates AI retries from critical notifications.
            # During Google import of 70 contacts, exponential backoff retries (5 min, 30 min, 2 h)
            # would block Telegram/Email if sharing the 'async' queue.
            ai_async:
                dsn: '%messenger_transport_ai_dsn%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 5
                    multiplier: 4
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: sync
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Route your messages to the transports
            'Ari\Message\ImportGoogleContactMessage': async
            'Ari\Message\GenerateAiSuggestionMessage': ai_async
            'Ari\Message\TriggerBatchAiAnalysisMessage': ai_async
