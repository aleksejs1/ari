api_platform:
    title: Ari CRM
    version: 0.0.0
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    exception_to_status:
        # API Platform defaults (must be repeated — useAttributeAsKey arrays do not merge with defaultValue)
        'Symfony\Component\Serializer\Exception\ExceptionInterface': 400
        'ApiPlatform\Exception\InvalidArgumentException': 400
        'Doctrine\ORM\OptimisticLockException': 409
        # Project-specific
        'Ari\Exception\InvalidStateTransitionException': 422
        'Ari\Exception\QuotaExceededException': 422
